{{- /*
  Redis Service. 앱은 이 Service 이름(configmap.yaml 의 REDIS_HOST)으로 접속한다. redis.enabled=true 일 때만 만든다.
  Redis 파드가 0개여도 Service 는 남아 있고 연결은 즉시 거부된다(R1 장애 재현 때의 모습).
*/ -}}
{{- if .Values.redis.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pytorch-infer.redis.fullname" . }}
  labels:
    {{- include "pytorch-infer.redis.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "pytorch-infer.redis.selectorLabels" . | nindent 4 }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
      protocol: TCP
{{- end }}
