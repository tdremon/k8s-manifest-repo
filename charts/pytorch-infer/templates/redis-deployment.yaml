{{- /*
  Redis Deployment (추론 결과 캐시). 기존 k8s/manifests/redis-deployment.yaml 을 chart 로 옮긴 것이다. redis.enabled=true 일 때만 만든다.
  읽는 순서: 토글 -> selector(앱과 다른 라벨) -> securityContext -> args(캐시 정책) -> resources -> probe

  values 로 열지 않고 "고정"한 것 (이유: DoD 4장, 결과 캐시라 유실돼도 되고 서로 공유하지 않는 별개 캐시가 되기 때문)
    - replicas 1  : 늘리면 파드마다 따로 캐시가 생겨 hit 비율만 떨어진다
    - Recreate    : 단일 인스턴스라 RollingUpdate 로 두 개가 잠깐 공존할 필요가 없다
    - 영속화 없음 : --save "" --appendonly no. 재시작하면 비어 있는 상태로 시작한다
*/ -}}
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pytorch-infer.redis.fullname" . }}
  labels:
    {{- include "pytorch-infer.redis.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "pytorch-infer.redis.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "pytorch-infer.redis.labels" . | nindent 8 }}
    spec:
      securityContext:
        {{- toYaml .Values.redis.podSecurityContext | nindent 8 }}
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          # maxmemory 에 닿으면 오래된 키부터 지운다(allkeys-lru). maxmemory 는 컨테이너 memory limit 보다 작게 둔다
          args: ["--save", "", "--appendonly", "no", "--maxmemory", {{ .Values.redis.maxMemory | quote }}, "--maxmemory-policy", "allkeys-lru"]
          securityContext:
            {{- toYaml .Values.redis.securityContext | nindent 12 }}
          ports:
            - name: redis
              containerPort: 6379
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
{{- end }}
