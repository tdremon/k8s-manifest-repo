{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "pytorch-infer.serviceAccountName" . }}
  labels:
    {{- include "pytorch-infer.labels" . | nindent 4 }}
# 이 SA 를 쓰는 파드의 기본값. Deployment 에서도 명시한다(RB1).
automountServiceAccountToken: {{ .Values.serviceAccount.automount }}
{{- end }}
