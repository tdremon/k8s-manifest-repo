apiVersion: v1
kind: Service
metadata:
  name: {{ include "pytorch-infer.fullname" . }}    # 클러스터 내부 DNS 이름이 된다 (같은 네임스페이스에서는 이 이름으로 접근)
  labels:
    {{- include "pytorch-infer.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "pytorch-infer.selectorLabels" . | nindent 4 }}
  ports:
    - name: http                      # ServiceMonitor 가 이 "이름"으로 포트를 찾는다. 고정
      port: {{ .Values.service.port }}
      targetPort: http                # Deployment 의 containerPort 이름(http)을 가리킨다. 포트 번호가 아니라 이름이라 번호가 바뀌어도 안전
      protocol: TCP
