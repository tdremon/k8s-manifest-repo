# pytorch-infer chart 의 기본값(default values).
#
# 읽는 법: 템플릿의 `.Values.a.b` 는 이 파일의 `a: b:` 값을 가리킨다. 환경마다 다른 값은 -f values-<환경>.yaml 이나 --set 으로 덮어쓴다.
# 값 우선순위(낮음 -> 높음): 이 파일 < -f 파일(뒤에 쓴 것이 우선) < --set
#
# 어떤 값을 values 로 빼는가 (chart 가이드 4장에 이유를 정리했다)
#   [빼는 것]   환경마다 달라지거나, 자주 바뀌거나, 쓰는 사람이 정해야 하는 값  (이미지 태그, replicas, 리소스, 토글, 앱 설정)
#   [안 빼는 것] chart 와 앱 사이의 약속이라 바뀌면 안 되는 값                    (selector 라벨, 포트 이름 `http`, Downward API env 이름)
#   [못 넣는 것] 비밀 값(토큰, 비밀번호). chart/values 에 넣지 않고 Secret 을 따로 만들어 "이름"만 참조한다

nameOverride: ""        # 앱 이름(라벨 app 의 값) 변경. 보통 비워 둔다
fullnameOverride: ""    # 리소스 이름 전체를 고정. 비우면 templates/_helpers.tpl 의 규칙을 따른다

# ---- 이미지 ----
image:
  repository: ghcr.io/tdremon/pytorch-infer
  # 비우면 Chart.yaml 의 appVersion 을 쓴다. 이 프로젝트는 `latest` 금지, git SHA 태그를 쓴다 (DoD 결정 #12).
  # 가장 자주 바뀌는 값이라 CI 가 이 줄(또는 --set image.tag)을 갱신하게 된다.
  tag: "sha-c0a7be8"
  pullPolicy: IfNotPresent
# private 레지스트리 pull 용 Secret "이름" 목록. Secret 자체는 chart 밖에서 만든다(값이 들어 있으므로 git/chart 에 넣지 않는다).
# 기본은 비어 있다(public 이미지). private GHCR 을 쓰는 환경은 values-kind.yaml 처럼 덮어쓴다.
imagePullSecrets: []

# ---- 파드 수 ----
# autoscaling.enabled=true 이면 replicaCount 는 무시된다. templates/deployment.yaml 이 replicas 줄을 아예 생략한다.
# (yaml 에 replicas 가 있으면 apply/upgrade 때마다 HPA 가 정한 값이 되돌려지기 때문. k8s/manifests/pytorch-infer-deployment.yaml 주석 참고)
replicaCount: 2
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 50    # requests.cpu 대비 평균 사용률(%)

# ---- 배포 방식 ----
revisionHistoryLimit: 10
strategy:                    # RollingUpdate 파라미터
  maxUnavailable: 1
  maxSurge: 2
terminationGracePeriodSeconds: 30        # 이미지의 uvicorn --timeout-graceful-shutdown 20 보다 길게 둔다
lifecycle:
  preStopSleepSeconds: 5     # SIGTERM 전에 endpoints 제거가 전파될 시간 (롤링 업데이트/drain 중 끊김 방지)

# ---- 컨테이너 ----
containerPort: 8000          # 앱(uvicorn)이 listen 하는 포트. 이미지(Dockerfile)와 맞아야 한다. 포트 "이름"은 http 로 고정(템플릿에 있음)
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

# probe 는 앱이 제공하는 경로에 의존하므로 values 로 둔다(앱이 바뀌면 같이 바뀌는 값).
startupProbe:
  httpGet:
    path: /readyz
    port: http
  periodSeconds: 2
  failureThreshold: 15       # 2초 x 15회 = 30초 안에 모델 로딩이 끝나야 한다
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 3
livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 10
  periodSeconds: 10
  failureThreshold: 3

# ---- 보안 (PS1: PSA restricted 를 통과하는 값. 기본값을 이렇게 두어 "안전한 쪽"이 기본이 되게 한다) ----
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001           # Dockerfile 의 appuser. 이름이 아니라 숫자로 적어야 kubelet 이 non-root 를 검증한다
  seccompProfile:
    type: RuntimeDefault
securityContext:             # 컨테이너 수준
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]
tmpVolume:
  sizeLimit: 64Mi            # readOnlyRootFilesystem 이라 쓰기 가능한 곳은 /tmp(emptyDir) 하나뿐이다

serviceAccount:
  create: true
  name: ""                   # 비우면 fullname
  automount: false           # 앱은 K8S API 를 쓰지 않으므로 토큰을 파드에 넣지 않는다 (RB1)

# ---- 스케줄링 (기본은 비어 있다. 필요하면 환경 values 에서 채운다) ----
nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []     # PD1: 파드가 한 노드에 몰리면 PDB 가 효과를 못 낸다. 분산이 필요하면 여기서 지정한다
podAnnotations: {}

# ---- 네트워크 ----
service:
  type: ClusterIP
  port: 8000
ingress:
  enabled: false
  className: nginx
  host: ""                   # 비우면 host 조건 없음(어떤 주소로 와도 매칭)
  path: /
  pathType: Prefix
  annotations: {}

# ---- 모니터링 ----
# ServiceMonitor 는 Prometheus Operator 의 CRD 다. 클러스터에 CRD 가 없으면 만들 수 없으므로 기본은 끈다.
serviceMonitor:
  enabled: false
  path: /metrics
  interval: ""               # 비우면 Prometheus 기본 수집 주기
  labels: {}                 # Prometheus 가 특정 라벨의 ServiceMonitor 만 고르도록 설정된 환경에서 필요

config:
  TORCH_NUM_THREADS: "1"
  STARTUP_DELAY: "10"
  REDIS_HOST: ""              # 빈 값 = 캐시를 끈다. redis.enabled=true 이면 이 값은 무시되고 chart 의 Redis Service 이름이 들어간다. chart 밖 Redis 를 쓰려면 여기에 주소를 적는다
  CACHE_TTL_SECONDS: "300"

pdb:
  enabled: false
  maxUnavailable: 1

# ---- Redis (추론 결과 캐시) ----
# 켜면 Redis Deployment + Service 를 같이 만들고 앱의 REDIS_HOST 를 그 Service 이름으로 맞춘다(templates/configmap.yaml).
# 기본은 끈다: 캐시가 hit 되면 추론을 건너뛰어 부하 테스트(HPA)가 CPU 를 못 올리므로, 캐시 유무를 선택하게 둔다.
# 아래 "고정"한 것(replicas 1, Recreate, 영속화 없음)은 values 로 열지 않았다: templates/redis-deployment.yaml 머리 주석 참고.
redis:
  enabled: false
  image:
    repository: redis
    tag: 7-alpine
    pullPolicy: IfNotPresent
  maxMemory: 64mb            # redis --maxmemory. resources.limits.memory 보다 작아야 OOMKilled 전에 키를 지운다
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  podSecurityContext:        # PS1: PSA restricted 를 통과하는 값
    runAsNonRoot: true
    runAsUser: 999           # redis:7-alpine 의 redis 사용자(앱의 10001 과 다르다)
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]


# ---- (직접 작성할 부분) ----
# H2 실습: 앱 설정(ConfigMap)을 values 의 `config:` 맵으로 빼는 것.  -> chart 가이드 H2 참고
# H3 실습: PDB 를 `pdb.enabled` 토글로 바꾸는 것.                  -> chart 가이드 H3 참고
